name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      PUBLIC_SITE_URL: https://wouldyouratherquestions.org

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify commit is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          remote_main="$(git rev-parse origin/main)"

          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale deployment."
            echo "Requested commit: $GITHUB_SHA"
            echo "Current main:     $remote_main"
            exit 1
          fi

      - name: Verify CI passed for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA&per_page=100"
          )"

          matching_runs="$(
            jq \
              '[.workflow_runs[] | select(
                .head_sha == env.GITHUB_SHA and
                .head_branch == "main" and
                .event == "push" and
                .conclusion == "success"
              )] | length' \
              <<<"$response"
          )"

          if [[ "$matching_runs" -lt 1 ]]; then
            echo "No successful main CI run exists for commit $GITHUB_SHA."
            exit 1
          fi

          echo "Verified successful CI for $GITHUB_SHA."

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run validate:launch && npm run build

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.144.0
          command: deploy

      - name: Verify deployed website
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "Wrangler did not return a deployment URL."
            exit 1
          fi

          npm run verify:deployment -- "$DEPLOYMENT_URL" "$GITHUB_SHA"
